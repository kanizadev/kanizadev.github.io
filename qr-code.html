<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaniza QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fira Code', monospace;
            background: linear-gradient(135deg, #050806 0%, #1a1a1a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(30, 30, 35, 0.8);
            border: 1px solid rgba(0, 255, 174, 0.3);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 255, 174, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ffae;
            font-size: 24px;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #00ffae;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(0, 255, 174, 0.5);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00ffae;
            box-shadow: 0 0 12px rgba(0, 255, 174, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .qr-display {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #qrCode {
            max-width: 100%;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-generate {
            background: linear-gradient(135deg, #00ffae 0%, #00cc8f 100%);
            color: #050806;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 255, 174, 0.4);
        }

        .btn-download {
            background: rgba(0, 255, 174, 0.2);
            color: #00ffae;
            border: 1px solid #00ffae;
        }

        .btn-download:hover {
            background: rgba(0, 255, 174, 0.3);
            transform: translateY(-2px);
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 174, 0.05);
            border-left: 3px solid #00ffae;
            border-radius: 4px;
            font-size: 12px;
            color: #b0b0b0;
            line-height: 1.6;
        }

        .presets {
            margin-bottom: 20px;
        }

        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 8px 12px;
            background: rgba(0, 255, 174, 0.1);
            border: 1px solid rgba(0, 255, 174, 0.3);
            border-radius: 4px;
            color: #00ffae;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: rgba(0, 255, 174, 0.2);
            border-color: #00ffae;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>QR Code Generator</h1>

        <div class="presets">
            <label>Quick Presets:</label>
            <div class="preset-buttons">
                <button type="button" class="preset-btn" onclick="setPreset('https://kanizadev.me')">Portfolio</button>
                <button type="button" class="preset-btn" onclick="setPreset('https://kanizadev.github.io')">GitHub
                    Pages</button>
                <button type="button" class="preset-btn" onclick="setPreset('mailto:mail@kanizadev.me')">Email</button>
                <button type="button" class="preset-btn"
                    onclick="setPreset('https://github.com/kanizadev')">GitHub</button>
            </div>
        </div>

        <div class="form-group">
            <label for="urlInput">URL or Text:</label>
            <input type="text" id="urlInput" placeholder="https://kanizadev.me" value="https://kanizadev.me" />
        </div>

        <div class="button-group">
            <button class="btn-generate" onclick="generateQR()">Generate QR Code</button>
            <button class="btn-download" id="downloadBtn" disabled onclick="downloadQR()">Download</button>
        </div>

        <div class="qr-display">
            <div id="qrCode"></div>
        </div>

        <div class="info">
            <strong>💡 Tip:</strong> QR codes are perfect for business cards, posters, or social media. Use this
            generator to create codes for your website, email, or any URL.
        </div>
    </div>

    <script>
        let qrCode = null;

        function setPreset(url) {
            document.getElementById('urlInput').value = url;
            generateQR();
        }

        function generateQR() {
            const url = document.getElementById('urlInput').value.trim();

            if (!url) {
                alert('Please enter a URL or text');
                return;
            }

            const qrContainer = document.getElementById('qrCode');
            qrContainer.innerHTML = '';

            try {
                qrCode = new QRCode(qrContainer, {
                    text: url,
                    width: 250,
                    height: 250,
                    correctLevel: QRCode.CorrectLevel.H,
                    colorDark: '#00ffae',
                    colorLight: '#050806'
                });

                document.getElementById('downloadBtn').disabled = false;
            } catch (error) {
                alert('Error generating QR code: ' + error.message);
                document.getElementById('downloadBtn').disabled = true;
            }
        }

        function downloadQR() {
            if (!qrCode) return;

            const canvas = document.querySelector('#qrCode canvas');
            if (!canvas) return;

            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'kaniza-qrcode.png';
            link.click();
        }

        // Generate QR code on page load
        window.addEventListener('load', () => {
            generateQR();
        });

        // Allow Enter key to generate
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateQR();
        });
    </script>
</body>

</html>
