name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Runs on all events (push and PR)
  validate:
    runs-on: ubuntu-latest
    name: Validate Code
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Check Node.js syntax
        run: node --check server.js
      
      - name: Verify static files
        run: |
          echo "Checking static files..."
          for file in index.html contact.html about.html projects.html style.css script.js; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ Missing: $file"
            fi
          done

  # Only runs on push to main branch
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create deploy directory
        run: |
          mkdir -p _deploy
          cp *.html _deploy/ 2>/dev/null || true
          cp *.css _deploy/ 2>/dev/null || true
          cp *.js _deploy/ 2>/dev/null || true
          cp *.jpg _deploy/ 2>/dev/null || true
          cp *.png _deploy/ 2>/dev/null || true
          cp *.pdf _deploy/ 2>/dev/null || true
          cp CNAME _deploy/ 2>/dev/null || true
          ls -la _deploy/
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
          retention-days: 1
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
      
      - name: ✅ Deployment Complete
        run: echo "🎉 Site deployed to ${{ steps.deployment.outputs.page_url }}"
      
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "Deployment failed. Check logs above for details."
          exit 1
